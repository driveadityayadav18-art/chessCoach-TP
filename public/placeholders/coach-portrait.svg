<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="portrait-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24211D" />
      <stop offset="50%" stop-color="#1B1916" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#D2734C" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#portrait-bg)" />
  <rect width="600" height="750" fill="url(#vignette)" />

  <!-- Subtle Archival Framing Box -->
  <rect x="30" y="30" width="540" height="690" fill="none" stroke="#D2734C" stroke-width="1.5" stroke-opacity="0.35" rx="6" />
  <rect x="38" y="38" width="524" height="674" fill="none" stroke="#E8DFD1" stroke-width="0.75" stroke-opacity="0.15" rx="4" />

  <!-- Corner Crop Reticles -->
  <path d="M22 45 V22 H45" fill="none" stroke="#D2734C" stroke-width="1.5" />
  <path d="M578 45 V22 H555" fill="none" stroke="#D2734C" stroke-width="1.5" />
  <path d="M22 705 V728 H45" fill="none" stroke="#D2734C" stroke-width="1.5" />
  <path d="M578 705 V728 H555" fill="none" stroke="#D2734C" stroke-width="1.5" />

  <!-- Stylized Staunton Chess Master Silhouette (Geometric Art Deco) -->
  <g transform="translate(230, 210)" fill="none" stroke="#E8DFD1" stroke-opacity="0.25" stroke-width="2">
    <!-- King Crown & Cross -->
    <path d="M70 20 V45 M57 32 H83" stroke="#D2734C" stroke-opacity="0.8" stroke-width="2.5" />
    <path d="M35 55 C35 45, 105 45, 105 55 L95 105 C95 125, 125 145, 125 185 L15 185 C15 145, 45 125, 45 105 Z" fill="#181614" fill-opacity="0.7" />
    <!-- Pedestal Base -->
    <rect x="10" y="185" width="120" height="20" rx="4" fill="#181614" fill-opacity="0.85" stroke="#D2734C" stroke-opacity="0.5" stroke-width="1.5" />
    <rect x="0" y="205" width="140" height="22" rx="4" fill="#181614" stroke="#E8DFD1" stroke-opacity="0.2" stroke-width="1" />
  </g>

  <!-- Editorial Metadata & Instructions -->
  <text x="300" y="495" fill="#D2734C" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="3" text-anchor="middle">
    [ PORTRAIT PLACEHOLDER ]
  </text>

  <text x="300" y="530" fill="#E8DFD1" font-family="Georgia, serif" font-size="22" font-style="italic" text-anchor="middle">
    Coach Aditya Yadav
  </text>

  <text x="300" y="560" fill="#E8DFD1" opacity="0.65" font-family="sans-serif" font-size="13" font-weight="500" letter-spacing="1" text-anchor="middle">
    10 Years Grandmaster Pedagogy
  </text>

  <rect x="120" y="595" width="360" height="42" rx="21" fill="#181614" fill-opacity="0.85" stroke="#D2734C" stroke-opacity="0.4" stroke-width="1" />
  <text x="300" y="621" fill="#D2734C" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle">
    REPLACE WITH REAL PHOTO (4:5 RATIO)
  </text>
</svg>
