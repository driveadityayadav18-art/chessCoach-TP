  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <rect x="160" y="60" width="480" height="480" fill="url(#board)" stroke="#D2734C" stroke-width="2" stroke-opacity="0.3" rx="8" />
  
  <!-- Subtle Coordinates -->
  <text x="170" y="80" fill="#D2734C" font-family="monospace" font-size="12" opacity="0.6">8</text>
  <text x="170" y="525" fill="#D2734C" font-family="monospace" font-size="12" opacity="0.6">1</text>
  <text x="180" y="535" fill="#D2734C" font-family="monospace" font-size="12" opacity="0.6">a</text>
  <text x="625" y="535" fill="#D2734C" font-family="monospace" font-size="12" opacity="0.6">h</text>
  
  <!-- Overlay Card Badge -->
  <rect x="220" y="240" width="360" height="120" rx="12" fill="#181614" fill-opacity="0.9" stroke="#D2734C" stroke-width="1.5" stroke-opacity="0.6" filter="drop-shadow(0 10px 25px rgba(0,0,0,0.5))" />
  <circle cx="250" cy="275" r="4" fill="#D2734C" />
  <text x="265" y="279" fill="#D2734C" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">BREAKTHROUGH STUDY 02</text>
  <text x="250" y="310" fill="#E8DFD1" font-family="Georgia, serif" font-size="19" font-weight="normal">Candidate Tree Logic (1600→2050)</text>
