      <stop offset="0%" stop-color="#181614" />
      <stop offset="100%" stop-color="#24211D" />
    </linearGradient>
    <pattern id="board" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#2A2621" />
      <rect x="30" width="30" height="30" fill="#1F1C18" />
      <rect y="30" width="30" height="30" fill="#1F1C18" />
      <rect x="30" y="30" width="30" height="30" fill="#2A2621" />
